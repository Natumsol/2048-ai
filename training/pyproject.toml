[project]
name = "2048-ai-training"
version = "0.1.0"
description = "Reproducible teacher, training, evaluation, and ONNX export for 2048 AI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<2",
  "onnx>=1.17,<2",
  "onnxruntime==1.23.2",
  "torch==2.2.2",
]

[dependency-groups]
dev = [
  "pyright>=1.1.400",
  "pytest>=8.4,<10",
  "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["environment", "teacher", "model", "scripts", "tests"]
exclude = ["data", "artifacts", ".venv"]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
